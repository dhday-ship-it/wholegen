

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Section</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --sage: #1A1A1A;
    --sage-light: #E5E5E5;
    --cream: #FFFFFF;
    --tan: #CCCCCC;
    --brown: #4D4D4D;
    --ink: #000000;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    min-height:100vh;
    font-family:'Pretendard', sans-serif;
    background: linear-gradient(150deg, var(--sage-light) 0%, var(--cream) 45%, var(--tan) 100%);
    color: var(--ink);
    overflow-x:hidden;
    position:relative;
  }

  .hero{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- NAV ---------- */
  .nav-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 22px 40px 0;
    position:relative;
    z-index:20;
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:60px;
    width:100%;
    max-width:1200px;
    padding: 16px 32px;
    background: var(--ink);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
  }
  .logo{
    font-family:'JetBrains Mono', monospace;
    font-size:18px;
    color: var(--cream);
    letter-spacing:0.5px;
  }
  .logo b{ color: var(--sage-light); font-weight:600; }

  .nav-links{
    display:flex;
    gap:48px;
    list-style:none;
  }
  .nav-links li{
    font-size:16.5px;
    letter-spacing:0.8px;
    color: rgba(255,255,255,0.85);
    cursor:pointer;
    transition: color .2s ease;
  }
  .nav-links li:hover{ color: var(--sage-light); }

  .inquiry-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    padding:8px 18px;
    border-radius:999px;
    background: var(--cream);
    color: var(--ink);
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition: background .2s ease, transform .2s ease;
    display:inline-block;
  }
  .inquiry-btn:hover{
    background: var(--sage-light);
    transform: translateY(-1px);
  }

  @media (max-width:900px){
    .nav-links{ display:none; }
  }

  /* ---------- MAIN CONTENT ---------- */
  .content{
    position:relative;
    z-index:15;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 80px 24px 120px;
  }

  .subtag{
    margin-top:0;
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    color: var(--brown);
    letter-spacing:0.5px;
  }

  .arrow{
    margin-top:60px;
    width:40px;
    height:40px;
    animation: bob 2.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(10px); }
  }

  /* ---------- AD SECTION (2/3 image : 1/3 info) ---------- */
  .ad-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 28px 40px 0;
    position:relative;
    z-index:20;
  }
  .ad-section{
    display:flex;
    width:100%;
    max-width:1280px;
    min-height:420px;
    border-radius:32px;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
  }
  .ad-image{
    flex:2;
    background: url('ex.jpg') center/cover no-repeat;
  }
  .ad-info{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:16px;
    padding: 48px 40px;
    background: var(--ink);
    color: var(--cream);
  }
  .ad-tag{
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    padding:10px 20px;
    border-radius:999px;
    background: var(--cream);
    color: var(--ink);
    font-weight:800;
    letter-spacing:0.5px;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
    animation: dday-pulse 2s ease-in-out infinite;
  }
  @keyframes dday-pulse{
    0%,100%{ box-shadow: 0 0 0 4px rgba(255,255,255,0.15); }
    50%{ box-shadow: 0 0 0 9px rgba(255,255,255,0.05); }
  }
  .ad-title{
    font-size:28px;
    font-weight:700;
    line-height:1.35;
  }
  .ad-divider{
    border:none;
    border-top:1px solid rgba(255,255,255,0.25);
    margin:4px 0;
  }
  .ad-details{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .ad-row dt{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color: var(--sage-light);
    margin-bottom:5px;
  }
  .ad-row dd{
    font-size:14px;
    line-height:1.55;
  }
  .ad-note{
    font-size:12px;
    color: rgba(255,255,255,0.6);
    line-height:1.5;
  }

  @media (max-width:900px){
    .ad-section{ flex-direction:column; min-height:0; border-radius:24px; }
    .ad-image{ min-height:220px; }
    .ad-info{ padding:36px 28px; }
    .ad-title{ font-size:26px; }
  }

  @media (max-width: 760px){
    .subtag{ font-size:14px; }
    .nav-wrap{ padding:16px 16px 0; }
    nav{ padding:12px 18px; gap:20px; border-radius:32px; }
    .ad-wrap{ padding:20px 16px 0; }
  }
</style>
</head>
<body>

<div class="hero">

  <!-- NAV -->
  <div class="nav-wrap">
    <nav>
      <div class="logo">WHOLEGEN<b>CAMP</b></div>
      <ul class="nav-links">
        <li>소개</li>
        <li>공지</li>
        <li>캠프</li>
        <li>자료실</li>
      </ul>
      <!-- TODO: href를 실제 카카오톡 채널 URL로 교체하세요 (예: https://pf.kakao.com/_xxxxxx/chat) -->
      <a class="inquiry-btn" href="https://pf.kakao.com/_your_channel_id/chat" target="_blank" rel="noopener noreferrer">문의</a>
    </nav>
  </div>

  <!-- AD SECTION (2/3 image : 1/3 info panel) -->
  <div class="ad-wrap">
    <section class="ad-section">
      <div class="ad-image"></div>
      <div class="ad-info">
        <span class="ad-tag" id="adDday">D-000</span>
        <h2 class="ad-title">Wholegen 캠프</h2>
        <hr class="ad-divider">
        <dl class="ad-details">
          <div class="ad-row">
            <dt>주제</dt>
            <dd>순전함 / 예수 그리스도 안에서 온전히 세워지는 세대</dd>
          </div>
          <div class="ad-row">
            <dt>주제구절</dt>
            <dd>너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 <br> 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라 <br> (로마서 12:2)</dd>
          </div>
          <div class="ad-row">
            <dt>일정</dt>
            <dd>27.01.01 ~ 27.01.02 하나님의 집</dd>
          </div>
        </dl>
      </div>
    </section>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <div class="subtag">growfield sustainability</div>

    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.6">
      <line x1="12" y1="4" x2="12" y2="20"/>
      <polyline points="6,14 12,20 18,14"/>
    </svg>
  </div>

</div>

<script>
  (function(){
    var today = new Date();
    today.setHours(0,0,0,0);
    var target = new Date(today.getFullYear(), 11, 25);
    if (target < today) target = new Date(today.getFullYear() + 1, 11, 25);
    var diffDays = Math.round((target - today) / 86400000);
    var label = diffDays === 0 ? 'D-DAY' : 'D-' + diffDays;
    document.getElementById('adDday').textContent = label;
  })();
</script>

</body>
</html>
