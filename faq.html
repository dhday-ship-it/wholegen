<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — WHOLEGENCAMP</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --sage: #1A1A1A;
    --sage-light: #E5E5E5;
    --cream: #FFFFFF;
    --tan: #CCCCCC;
    --brown: #4D4D4D;
    --ink: #000000;

    --section-gap: 80px;
    --section-gap-mobile: 52px;
    --content-px: 40px;
    --content-px-mobile: 20px;

    --fs-display: 48px;
    --fs-h2: 36px;
    --fs-h3: 24px;
    --fs-body: 15px;
    --fs-small: 13px;
    --fs-xs: 11.5px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    min-height:100vh;
    font-family:'Pretendard', sans-serif;
    background: linear-gradient(150deg, var(--sage-light) 0%, var(--cream) 45%, var(--tan) 100%);
    color: var(--ink);
    overflow-x:hidden;
    font-size: var(--fs-body);
    line-height: 1.6;
  }

  /* ---------- NAV ---------- */
  .nav-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 24px var(--content-px) 0;
    position:relative;
    z-index:20;
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:48px;
    width:100%;
    max-width:1200px;
    padding: 14px 32px;
    background: var(--ink);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    position:relative;
  }
  .logo{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    color: var(--cream);
    letter-spacing:0.5px;
    text-decoration:none;
  }
  .logo b{ color: var(--sage-light); font-weight:600; }
  .nav-links{
    display:flex;
    gap:40px;
    list-style:none;
  }
  .nav-links li a{
    font-size: var(--fs-body);
    letter-spacing:0.6px;
    color: rgba(255,255,255,0.85);
    text-decoration:none;
    transition: color .2s ease;
  }
  .nav-links li a:hover{ color: var(--sage-light); }
  .nav-links li a.active{ color: var(--cream); font-weight:600; }
  .inquiry-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: var(--fs-small);
    padding:9px 20px;
    border-radius:999px;
    background: var(--cream);
    color: var(--ink);
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition: background .2s ease, transform .2s ease;
    display:inline-block;
  }
  .inquiry-btn:hover{
    background: var(--sage-light);
    transform: translateY(-1px);
  }
  .nav-toggle{
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    width:28px;
    height:22px;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
  }
  .nav-toggle span{
    display:block;
    width:100%;
    height:2px;
    background: var(--cream);
    border-radius:2px;
    transition: transform .2s ease, opacity .2s ease;
  }
  .nav-toggle.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2){ opacity:0; }
  .nav-toggle.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }
  @media (max-width:900px){
    .nav-toggle{ display:flex; order:3; }
    .nav-links{
      display:none;
      position:absolute;
      top:calc(100% + 12px);
      left:0;
      right:0;
      flex-direction:column;
      gap:0;
      background: var(--ink);
      border-radius:20px;
      padding:8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      z-index:30;
    }
    .nav-links.open{ display:flex; }
    .nav-links li a{ display:block; padding:14px 16px; border-radius:12px; }
    .nav-links li:hover a{ background: rgba(255,255,255,0.08); }
    .inquiry-btn{ order:2; }
    .logo{ order:1; }
  }
  @media (max-width:760px){
    .nav-wrap{ padding:16px var(--content-px-mobile) 0; }
    nav{ padding:12px 18px; gap:20px; border-radius:32px; }
  }

  /* ---------- PAGE CONTENT ---------- */
  .page-content{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom: var(--section-gap);
  }

  /* ---------- FAQ ---------- */
  .faq-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: var(--section-gap) var(--content-px) 0;
  }
  .faq-header{
    text-align:center;
    margin-bottom:36px;
  }
  .faq-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: var(--fs-xs);
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color: var(--brown);
  }
  .faq-title{
    margin-top:10px;
    font-size: var(--fs-h2);
    font-weight:800;
    letter-spacing:-0.5px;
  }

  .faq-list{
    width:100%;
    max-width:900px;
    border-radius:28px;
    overflow:hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.06);
    background: var(--ink);
  }
  .faq-item{
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .faq-item:last-child{ border-bottom:none; }
  .faq-q{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:26px 36px;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:'Pretendard', sans-serif;
    color: var(--cream);
  }
  .faq-q-text{
    font-size: var(--fs-h3);
    font-weight:700;
  }
  .faq-icon{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    color: rgba(255,255,255,0.7);
    transition: transform .25s ease, background .25s ease, border-color .25s ease;
  }
  .faq-item.open .faq-icon{
    transform: rotate(135deg);
    background: var(--cream);
    border-color: var(--cream);
    color: var(--ink);
  }
  .faq-a{
    max-height:0;
    overflow:hidden;
    transition: max-height .3s ease;
  }
  .faq-item.open .faq-a{ max-height:240px; }
  .faq-a-inner{
    padding:0 36px 26px;
    font-size: var(--fs-body);
    line-height:1.8;
    color: rgba(255,255,255,0.65);
  }

  @media (max-width:760px){
    .faq-wrap{ padding: var(--section-gap-mobile) var(--content-px-mobile) 0; }
    .faq-title{ font-size:26px; }
    .faq-list{ border-radius:20px; }
    .faq-q{ padding:20px 22px; }
    .faq-q-text{ font-size:17px; }
    .faq-a-inner{ padding:0 22px 20px; }
  }

  /* ---------- FOOTER ---------- */
  .site-footer{
    width:100%;
    margin-top: var(--section-gap);
    background: var(--ink);
    padding: 52px var(--content-px) 36px;
  }
  .footer-inner{
    max-width:1280px;
    margin:0 auto;
  }
  .footer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
  }
  .footer-logo{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    color: var(--cream);
    letter-spacing:0.5px;
  }
  .footer-logo b{ color: var(--sage-light); font-weight:600; }
  .footer-links{
    display:flex;
    gap:28px;
    list-style:none;
  }
  .footer-links a{
    color: rgba(255,255,255,0.7);
    text-decoration:none;
    font-size: var(--fs-body);
    transition: color .2s ease;
  }
  .footer-links a:hover{ color: var(--cream); }
  .footer-divider{
    margin:32px 0 24px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .footer-bottom{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-size: var(--fs-xs);
    letter-spacing:0.3px;
    color: rgba(255,255,255,0.4);
  }
  @media (max-width:600px){
    .site-footer{ padding:36px var(--content-px-mobile) 24px; }
    .footer-top{ flex-direction:column; align-items:flex-start; gap:16px; }
    .footer-links{ flex-wrap:wrap; gap:16px 20px; }
    .footer-bottom{ flex-direction:column; gap:8px; }
  }
</style>
</head>

<script>
  // Mobile nav toggle
  (function(){
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if (!toggle || !links) return;
    toggle.addEventListener('click', function(){
      var isOpen = links.classList.toggle('open');
      toggle.classList.toggle('open', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    links.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        links.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();

  // FAQ accordion
  (function(){
    document.querySelectorAll('.faq-q').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.closest('.faq-item').classList.toggle('open');
      });
    });
  })();
</script>
