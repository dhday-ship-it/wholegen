<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ · WHOLEGENCAMP</title>
<script>document.documentElement.classList.add('js');</script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --sage: #1A1A1A;
    --sage-light: #E5E5E5;
    --cream: #FFFFFF;
    --tan: #CCCCCC;
    --brown: #4D4D4D;
    --ink: #000000;
    --pw-accent: #9DB1EE;
    --surface: #121826;
    --surface-2: #1A2132;
    --line: rgba(255,255,255,0.07);

    /* Spacing scale */
    --section-gap: 128px;
    --section-gap-mobile: 80px;
    --head-gap: 44px;          /* section heading → content */
    --head-gap-mobile: 28px;
    --content-px: 40px;
    --content-px-mobile: 20px;

    /* Type scale */
    --fs-display: 48px;
    --fs-h2: 40px;
    --fs-h3: 24px;
    --fs-body: 15px;
    --fs-small: 13px;
    --fs-xs: 11.5px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{ scroll-behavior:smooth; scroll-padding-top:72px; }

  html,body{
    width:100%;
    min-height:100vh;
    font-family:'Pretendard', sans-serif;
    background: #0B0F17;
    color: #EDEFF3;
    overflow-x:clip;
    position:relative;
    font-size: var(--fs-body);
    line-height: 1.6;
  }

  .site-top{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    background: transparent;
    border-bottom:1px solid transparent;
    transition: background .3s ease, border-color .3s ease;
  }
  .site-top.is-solid,
  .site-top.menu-open{
    background: rgba(11,15,23,0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom-color: rgba(255,255,255,0.07);
  }
  .site-top .logo,
  .site-top .logo b,
  .site-top .nav-links li,
  .site-top .inquiry-btn{ transition: color .3s ease, background .3s ease, transform .2s ease; }
  .site-top .logo{ color:#fff; }
  .site-top .logo b{ color: rgba(255,255,255,0.6); }
  .site-top .inquiry-btn{ background:#fff; color:#0B0F17; }
  .site-top .inquiry-btn:hover{ background: var(--pw-accent); }
  .site-top .nav-toggle span{ background:#fff; }
  @media (min-width:901px){
    .site-top .nav-links li{ color:#fff; }
    .site-top .nav-links li:hover{ color: rgba(255,255,255,0.65); }
  }

  /* ---------- NAV ---------- */
  .nav-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 24px var(--content-px) 0;
    position:relative;
    z-index:40;
  }
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:48px;
    width:100%;
    max-width:1280px;
    position:relative;
  }
  .logo{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    font-weight:700;
    color: var(--ink);
    letter-spacing:0.5px;
  }
  .logo b{ color: var(--brown); font-weight:700; }

  .nav-links{
    display:flex;
    gap:40px;
    list-style:none;
  }
  .nav-links li{
    font-size: var(--fs-body);
    font-weight:600;
    letter-spacing:0.6px;
    color: var(--ink);
    cursor:pointer;
    transition: color .2s ease;
  }
  .nav-links li a{ color:inherit; text-decoration:none; }
  .nav-links li:hover{ color: var(--brown); }

  .inquiry-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: var(--fs-small);
    padding:9px 20px;
    border-radius:999px;
    background: var(--ink);
    color: var(--cream);
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition: background .2s ease, transform .2s ease;
    display:inline-block;
  }
  .inquiry-btn:hover{
    background: var(--brown);
    transform: translateY(-1px);
  }

  .nav-toggle{
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:5px;
    width:28px;
    height:22px;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
  }
  .nav-toggle span{
    display:block;
    width:100%;
    height:2px;
    background: var(--ink);
    border-radius:2px;
    transition: transform .2s ease, opacity .2s ease;
  }
  .nav-toggle.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2){ opacity:0; }
  .nav-toggle.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  @media (max-width:900px){
    .nav-toggle{ display:flex; order:3; }
    .nav-links{
      display:none;
      position:absolute;
      top:calc(100% + 12px);
      left:0;
      right:0;
      flex-direction:column;
      gap:0;
      background: rgba(18,24,38,0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius:20px;
      padding:8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.07);
      z-index:30;
    }
    .nav-links.open{ display:flex; }
    .nav-links li{ padding:0; }
    .nav-links li a{
      display:block;
      padding:14px 16px;
      border-radius:12px;
    }
    .nav-links li{ color:#fff; }
    .nav-links li:hover{ background: rgba(255,255,255,0.06); }
    .inquiry-btn{ order:2; margin-left:auto; }
    .logo{ order:1; }
  }

  /* ---------- SCROLL REVEAL ---------- */
  .js .reveal{
    opacity:0;
    transform: translateY(28px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .js .reveal.in{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .js .reveal{ opacity:1; transform:none; transition:none; }
  }


  /* ---------- PAGE ---------- */
  .page-head{
    width:100%;
    padding:160px var(--content-px) 0;
    text-align:center;
  }
  .page-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:3px;
    color: var(--pw-accent);
  }
  .page-title{
    margin-top:12px;
    font-size:56px;
    font-weight:800;
    letter-spacing:-0.03em;
    line-height:1.1;
  }
  .page-section{
    width:100%;
    display:flex;
    justify-content:center;
    padding: var(--section-gap) var(--content-px) 0;
  }
  .page-section.first{ padding-top: var(--head-gap); }
  .page-inner{ width:100%; max-width:1280px; }
  .section-title{
    font-size: var(--fs-h2);
    font-weight:800;
    letter-spacing:-0.5px;
    text-align:center;
    color:#fff;
  }
  .page-end{ height: var(--section-gap); }
  @media (max-width:760px){
    .page-head{ padding:112px var(--content-px-mobile) 0; }
    .page-title{ font-size:36px; }
    .page-section{ padding: var(--section-gap-mobile) var(--content-px-mobile) 0; }
    .page-section.first{ padding-top: var(--head-gap-mobile); }
    .section-title{ font-size:28px; }
    .page-end{ height: var(--section-gap-mobile); }
  }

  .faq-list{
    max-width:880px;
    margin:0 auto;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .faq-item{ border-bottom:1px solid rgba(255,255,255,0.12); }
  .faq-q{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:26px 4px;
    background:none;
    border:none;
    color:#fff;
    font-family:inherit;
    font-size:18px;
    font-weight:700;
    text-align:left;
    cursor:pointer;
  }
  .faq-q:hover .faq-q-text{ color: var(--pw-accent); }
  .faq-q-text{ transition: color .2s ease; }
  .faq-icon{
    flex:none;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.2);
    font-size:18px;
    font-weight:400;
    transition: transform .25s ease, background .2s ease, color .2s ease;
  }
  .faq-item.open .faq-icon{ transform: rotate(45deg); background:#fff; color:#0B0F17; border-color:#fff; }
  .faq-a{
    display:grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .3s ease;
  }
  .faq-item.open .faq-a{ grid-template-rows: 1fr; }
  .faq-a-inner{
    overflow:hidden;
    padding:0 4px;
    font-size:15px;
    line-height:1.8;
    color: rgba(255,255,255,0.65);
  }
  .faq-item.open .faq-a-inner{ padding-bottom:26px; }
  .faq-more{
    max-width:880px;
    margin:48px auto 0;
    padding:32px;
    border-radius:20px;
    background: var(--surface);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .faq-more p{ font-size:16px; font-weight:600; }
  .faq-more p small{ display:block; margin-top:4px; font-size:13.5px; font-weight:400; color: rgba(255,255,255,0.55); }
  .faq-more a{
    padding:12px 22px;
    border-radius:12px;
    background:#fff;
    color:#0B0F17;
    font-size:14px;
    font-weight:700;
    text-decoration:none;
  }
  @media (max-width:760px){
    .faq-q{ padding:20px 2px; font-size:16px; }
    .faq-more{ margin-top:32px; padding:22px; }
  }

  main{ min-height: calc(100vh - 160px); }

  /* ---------- FOOTER ---------- */
  .site-footer{
    width:100%;
    background:#06080D;
    border-top:1px solid var(--line);
    padding: 52px var(--content-px) 36px;
  }
  .footer-inner{
    max-width:1280px;
    margin:0 auto;
  }
  .footer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
  }
  .footer-logo{
    font-family:'JetBrains Mono', monospace;
    font-size:17px;
    color: var(--cream);
    letter-spacing:0.5px;
  }
  .footer-logo b{ color: rgba(255,255,255,0.5); font-weight:600; }
  .footer-links{
    display:flex;
    gap:28px;
    list-style:none;
  }
  .footer-links a{
    color: rgba(255,255,255,0.7);
    text-decoration:none;
    font-size: var(--fs-body);
    transition: color .2s ease;
  }
  .footer-links a:hover{ color: var(--cream); }
  .footer-divider{
    margin:32px 0 24px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  .footer-bottom{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-size: var(--fs-xs);
    letter-spacing:0.3px;
    color: rgba(255,255,255,0.4);
  }

  @media (max-width:600px){
    .site-footer{ padding:36px var(--content-px-mobile) 24px; }
    .footer-top{ flex-direction:column; align-items:flex-start; gap:16px; }
    .footer-links{ flex-wrap:wrap; gap:16px 20px; }
    .footer-bottom{ flex-direction:column; gap:8px; }
  }
</style>
</head>

<script>
  // Header: transparent over hero, solid after
  (function(){
    var header = document.querySelector('.site-top');
    var banner = document.querySelector('.banner');
    if (!header) return;
    if (!banner){ header.classList.add('is-solid'); return; }
    function update(){
      header.classList.toggle('is-solid', window.scrollY > banner.offsetHeight - header.offsetHeight);
    }
    update();
    window.addEventListener('scroll', update, { passive:true });
    window.addEventListener('resize', update);
  })();

  // Scroll reveal
  (function(){
    var els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)){
      els.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -10% 0px' });
    els.forEach(function(el){ io.observe(el); });
  })();

  (function(){
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if (!toggle || !links) return;
    toggle.addEventListener('click', function(){
      var isOpen = links.classList.toggle('open');
      document.querySelector('.site-top').classList.toggle('menu-open', isOpen);
      toggle.classList.toggle('open', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    links.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        links.classList.remove('open');
        document.querySelector('.site-top').classList.remove('menu-open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();

  // FAQ accordion
  (function(){
    document.querySelectorAll('.faq-q').forEach(function(btn){
      btn.addEventListener('click', function(){
        var open = btn.closest('.faq-item').classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });
  })();
</script>
