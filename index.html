
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHOLEGENCAMP</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --sage: #9CAF8A;
    --cream: #F7F3E6;
    --ink: #3E3A32;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    background: #000;
    overflow:hidden;
  }

  .landing{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
  }

  video#bg-video{
    position:absolute;
    top:50%;
    left:50%;
    min-width:100%;
    min-height:100%;
    width:auto;
    height:auto;
    transform: translate(-50%,-50%);
    object-fit:cover;
    z-index:1;
  }

  .overlay{
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.4) 45%, rgba(0,0,0,0.7) 100%);
    z-index:2;
  }

  .landing-text{
    position:relative;
    z-index:3;
    color: var(--cream);
    padding: 0 24px;
  }

  .landing-text .sub{
    font-family:'Pretendard', sans-serif;
    font-weight:600;
    font-size:24px;
    line-height:1.5;
    letter-spacing:-0.2px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8), 0 4px 24px rgba(0,0,0,0.6);
  }

  .landing-text .brand{
    margin-top:18px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:44px;
    letter-spacing:2px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8), 0 4px 24px rgba(0,0,0,0.6);
  }

  .landing-text .brand .wholegen{
    color: #B9D1A6;
  }

  .skip-btn{
    position:absolute;
    right:28px;
    bottom:28px;
    z-index:5;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.5px;
    color: rgba(247,243,230,0.85);
    background: rgba(62,58,50,0.45);
    border: 1px solid rgba(247,243,230,0.35);
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    transition: background .2s ease, color .2s ease;
  }
  .skip-btn:hover{
    background: rgba(247,243,230,0.9);
    color: var(--ink);
  }

  @media (max-width:760px){
    .landing-text .sub{ font-size:17px; }
    .landing-text .brand{ font-size:28px; letter-spacing:1px; }
  }
</style>
</head>
<body>

<div class="landing">
  <!-- 같은 폴더의 "character.mp4" 재생, 끝나면 main.html로 이동 -->
  <video id="bg-video" autoplay muted playsinline>
    <source src="character.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="landing-text">
    <div class="sub">하나님을 아는 순전한 세대</div>
    <div class="brand"><span class="wholegen">WHOLEGEN</span>CAMP</div>
  </div>

  <a class="skip-btn" href="main.html">건너뛰기</a>
</div>

<script>
  const video = document.getElementById('bg-video');

  // 영상 로드 실패 시 콘솔에서 원인 확인 가능 (F12 → Console)
  video.addEventListener('error', () => {
    console.error('영상 로드 실패: 파일명/경로를 확인하세요. 현재 경로:', video.currentSrc);
  });

  // 영상이 끝나면 main.html로 이동
  video.addEventListener('ended', () => {
    window.location.href = 'main.html';
  });

  // 혹시 자동재생이 막히는 브라우저 대비 - 클릭 시 재생 시도
  document.addEventListener('click', () => {
    if (video.paused) video.play().catch(()=>{});
  }, { once: true });
</script>

</body>
</html>
